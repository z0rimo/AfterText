name: CI

# Manual only: no automatic runs on push or pull request (cost). Run it from
# the Actions tab (or `gh workflow run CI --ref <branch>`) when deciding a merge.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported version, Maintenance LTS, and Active LTS.
        node: ["20.19.0", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - run: npm run verify:pack
