name: CI

# Manual only: no automatic runs on push or pull request (cost). Run it from
# the Actions tab (or `gh workflow run CI --ref <branch>`) when deciding a merge.
on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: Node test scope
        type: choice
        required: true
        default: node22
        options:
          - node22
          - all

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # node22: latest 22.x. all: lowest supported (22.12.0) and Active LTS (24).
        node: ${{ fromJSON(inputs.test_scope == 'all' && '["22.12.0","24"]' || '["22"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - run: npm run verify:pack
