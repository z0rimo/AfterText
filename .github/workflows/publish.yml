name: Publish

# Release workflow: runs only when a version tag is pushed (never on ordinary
# pushes or pull requests). Publishes the four public packages to npm with
# Trusted Publishing (OIDC): no long-lived npm token, provenance generated by
# npm. The publish job waits for approval on the `npm-publish` environment.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tag must match every package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in compiler runtime player web-renderer; do
            v="$(node -p "require('./packages/$p/package.json').version")"
            if [ "$v" != "$tag" ]; then
              echo "::error::packages/$p version $v does not match tag $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - run: npm run verify:pack

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Trusted Publishing needs npm >= 11.5.1 (fail closed; nothing is installed here)
        run: |
          required="11.5.1"
          current="$(npm --version)"
          echo "npm $current (required: >= $required)"
          if [ "$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -n 1)" != "$required" ]; then
            echo "::error::npm $current is older than $required, which npm Trusted Publishing needs. Not publishing."
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Publish (dependency order; skips versions that already exist, so a failed run can be re-run)
        run: |
          for p in compiler runtime player web-renderer; do
            name="@aftertext/$p"
            version="$(node -p "require('./packages/$p/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published; skipping"
              continue
            fi
            echo "Publishing $name@$version"
            npm publish --workspace "$name" --access public
          done
